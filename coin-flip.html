<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Fire & Ice | Coin Flip</title>
<style>
:root{--bg:#07090d;--ink:#f7f9fc;--muted:#9eabba;--fire:#ff6428;--fire2:#ffb35e;--ice:#62d8ff;--ice2:#d7f8ff;--gold:#ffd15a;--line:rgba(255,255,255,.13);--shadow:0 25px 80px rgba(0,0,0,.52)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 18%,rgba(255,81,28,.18),transparent 28%),radial-gradient(circle at 88% 14%,rgba(83,211,255,.17),transparent 30%),linear-gradient(145deg,#05070b,#0d121a 58%,#07090d);overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(circle at 20% 80%,rgba(255,106,42,.9) 0 1px,transparent 2px),radial-gradient(circle at 72% 18%,rgba(97,215,255,.85) 0 1px,transparent 2px);background-size:58px 58px,76px 76px}
.app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}.topbar{height:88px;padding:10px 25px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:rgba(5,7,11,.72);backdrop-filter:blur(15px)}.topbar img{width:82px;height:66px;object-fit:contain;filter:drop-shadow(0 7px 18px rgba(0,0,0,.38))}.brand b{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted)}.brand span{font-size:20px;font-weight:950}.back{margin-left:auto;color:#d8e0ea;text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:850;background:rgba(255,255,255,.045)}
main{flex:1;min-height:0;display:grid;place-items:center;padding:22px}.stage{width:min(1180px,95vw);height:min(780px,calc(100vh - 145px));min-height:540px;border:1px solid var(--line);border-radius:34px;background:linear-gradient(155deg,rgba(18,23,32,.95),rgba(8,11,16,.92));box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;align-items:center;text-align:center;padding:24px 30px 30px;overflow:hidden;position:relative}.stage:before{content:"";position:absolute;left:-18%;bottom:-55%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,94,39,.23),transparent 65%)}.stage:after{content:"";position:absolute;right:-18%;top:-55%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(90,216,255,.22),transparent 65%)}.title{position:relative;z-index:2}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:#b9f0ff;font-weight:900}.title h1{margin:7px 0 2px;font-size:clamp(34px,4vw,58px);letter-spacing:-.045em}.title p{margin:0;color:var(--muted);font-size:15px}
.coin-zone{position:relative;z-index:2;display:grid;place-items:center;perspective:1300px;min-height:0}.coin-wrap{position:relative;width:min(400px,55vh,62vw);aspect-ratio:1;display:grid;place-items:center}.coin-shadow{position:absolute;width:70%;height:12%;bottom:2%;border-radius:50%;background:rgba(0,0,0,.48);filter:blur(20px);transform:scaleX(1.05);transition:.2s}.coin{width:82%;height:82%;position:relative;transform-style:preserve-3d;border-radius:50%;will-change:transform}.coin.flipping{animation:coinFlip 2.15s cubic-bezier(.18,.72,.18,1)}@keyframes coinFlip{0%{transform:rotateX(0) rotateY(0) translateY(0) scale(1)}15%{transform:rotateX(480deg) rotateY(160deg) translateY(-80px) scale(1.08)}52%{transform:rotateX(1350deg) rotateY(480deg) translateY(-135px) scale(1.12)}86%{transform:rotateX(2210deg) rotateY(790deg) translateY(-30px) scale(1.03)}100%{transform:rotateX(var(--endX)) rotateY(var(--endY)) translateY(0) scale(1)}}.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid #d6aa32;box-shadow:inset 0 0 0 5px rgba(255,255,255,.24),inset 0 0 40px rgba(0,0,0,.34),0 20px 65px rgba(0,0,0,.45);overflow:hidden}.face:after{content:"";position:absolute;inset:8%;border:2px solid rgba(255,255,255,.22);border-radius:50%}.heads{background:radial-gradient(circle at 34% 28%,#fff0a0 0 5%,#ffc94e 25%,#f28b21 56%,#a93616 100%)}.tails{background:radial-gradient(circle at 34% 28%,#effdff 0 5%,#8ee8ff 28%,#3aa9dd 58%,#115475 100%);transform:rotateY(180deg)}.side-label{font-size:clamp(44px,7vw,88px);font-weight:1000;letter-spacing:-.055em;line-height:.9;text-shadow:0 3px 5px rgba(0,0,0,.28)}.heads .side-label{color:#4b1609}.tails .side-label{color:#062c40}.symbol{font-size:clamp(34px,5vw,62px);font-weight:1000;margin-top:13px;border:3px solid currentColor;width:1.25em;height:1.25em;border-radius:50%;display:grid;place-items:center;line-height:1}.heads .symbol{color:#7b2510}.tails .symbol{color:#0a4c69}
.result{height:68px;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,4.4vw,64px);font-weight:1000;letter-spacing:.06em;text-transform:uppercase;opacity:0;transform:translateY(10px) scale(.96);transition:.25s}.result.show{opacity:1;transform:none}.result.heads-result{color:#ffb35e;text-shadow:0 0 28px rgba(255,100,40,.28)}.result.tails-result{color:#9beaff;text-shadow:0 0 28px rgba(98,216,255,.28)}
.controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#161d28;color:white;padding:14px 22px;border-radius:14px;font-weight:950;font-size:16px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.22)}.btn.primary{border:0;background:linear-gradient(135deg,#ff6a2a,#f23c20);min-width:180px}.btn:disabled{opacity:.55;cursor:not-allowed}.hint{color:#7f8b9b;font-size:12px;font-weight:800}.history{position:absolute;right:18px;bottom:18px;z-index:4;display:flex;gap:7px;align-items:center;color:#8290a1;font-size:11px;font-weight:850}.chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#141b24;color:white}.chip.h{border-color:rgba(255,126,55,.5);color:#ffc192}.chip.t{border-color:rgba(98,216,255,.5);color:#b9f0ff}
@media(max-width:700px){.topbar{height:75px;padding:8px 14px}.topbar img{width:68px;height:55px}.brand span{font-size:16px}.stage{height:calc(100vh - 95px);min-height:520px;padding:18px 14px}.coin-wrap{width:min(360px,65vw,48vh)}.history{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><img src="fire-and-ice-logo.png" alt="Fire & Ice"><div class="brand"><b>ASSOCIATE RALLY</b><span>Coin Flip</span></div><a class="back" href="./">← Trivia</a></header>
<main>
<section class="stage">
  <div class="title"><div class="eyebrow">Tie Breaker • 50 / 50</div><h1>Heads or Tails?</h1><p>Press the button or hit the space bar.</p></div>
  <div class="coin-zone">
    <div class="coin-wrap">
      <div class="coin-shadow" id="shadow"></div>
      <div class="coin" id="coin">
        <div class="face heads"><div class="side-label">HEADS</div><div class="symbol">H</div></div>
        <div class="face tails"><div class="side-label">TAILS</div><div class="symbol">T</div></div>
      </div>
    </div>
    <div class="result" id="result">READY</div>
  </div>
  <div class="controls"><button class="btn primary" id="flipBtn">FLIP COIN</button><button class="btn" id="resetBtn">Reset</button><span class="hint">Space = flip • F = fullscreen</span></div>
  <div class="history" id="history"><span>Recent:</span></div>
</section>
</main>
</div>
<script>
(()=>{
const coin=document.getElementById('coin'),result=document.getElementById('result'),flipBtn=document.getElementById('flipBtn'),shadow=document.getElementById('shadow'),history=document.getElementById('history');
let busy=false,rotationY=0,flips=[];
function fairBit(){if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]&1}return Math.random()<.5?0:1}
function setStatic(side){rotationY=side==='heads'?0:180;coin.style.transform='rotateY('+rotationY+'deg)';result.textContent=side.toUpperCase();result.className='result show '+side+'-result'}
function renderHistory(){history.querySelectorAll('.chip').forEach(x=>x.remove());flips.slice(-6).forEach(s=>{const c=document.createElement('span');c.className='chip '+(s==='heads'?'h':'t');c.textContent=s==='heads'?'H':'T';history.appendChild(c)})}
function flip(){if(busy)return;busy=true;flipBtn.disabled=true;result.className='result';result.textContent='';const side=fairBit()?'heads':'tails';const extraSpins=side==='heads'?8:8.5;const endY=rotationY+(extraSpins*360);coin.style.setProperty('--endX',(2160+Math.floor(Math.random()*360))+'deg');coin.style.setProperty('--endY',endY+'deg');coin.classList.remove('flipping');void coin.offsetWidth;coin.classList.add('flipping');shadow.style.transform='scaleX(.65)';shadow.style.opacity='.55';setTimeout(()=>{rotationY=side==='heads'?0:180;coin.classList.remove('flipping');coin.style.transform='rotateY('+rotationY+'deg)';shadow.style.transform='scaleX(1.05)';shadow.style.opacity='1';result.textContent=side.toUpperCase();result.className='result show '+side+'-result';flips.push(side);renderHistory();flipBtn.disabled=false;busy=false},2160)}
function reset(){if(busy)return;flips=[];renderHistory();rotationY=0;coin.style.transform='rotateY(0deg)';result.textContent='READY';result.className='result'}
flipBtn.onclick=flip;document.getElementById('resetBtn').onclick=reset;
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});
})();
</script>
</body></html>
