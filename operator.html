<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire & Ice Trivia Operator</title>
<style>
:root{--bg:#090c11;--p:#121823;--ink:#f7f9fc;--mut:#99a5b6;--fire:#ff6428;--ice:#62d8ff;--green:#73e29a;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.head img{width:72px;height:64px;object-fit:contain}.head h1{font-size:22px;margin:0}.head p{margin:3px 0 0;color:var(--mut)}.card{border:1px solid var(--line);background:var(--p);border-radius:18px;padding:18px;margin:12px 0}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:850}.ticket{border-color:#6bdcff;color:#d9f8ff}.ticket.t10{border-color:#ffd45b;color:#fff0a8}.q{font-size:26px;line-height:1.18;font-weight:900;margin:16px 0}.answer{border-left:4px solid var(--green);padding:12px 15px;background:rgba(115,226,154,.08);border-radius:0 12px 12px 0}.answer b{display:block;color:#a9f4bd;font-size:18px}.fact{color:#c5cfdb;margin-top:6px;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.btn{border:1px solid var(--line);background:#18202d;color:white;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#ff6a2a,#f33c20);border-color:transparent}.btn.ice{border-color:rgba(98,216,255,.45);background:rgba(98,216,255,.1)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{width:85px;background:#0d1219;color:white;border:1px solid var(--line);border-radius:10px;padding:10px}.small{font-size:12px;color:var(--mut)}.links a{color:#b9f0ff;margin-right:14px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.q{font-size:22px}}
</style></head><body><div class="wrap">
<div class="head"><img src="fire-and-ice-logo.png" alt=""><div><h1>Trivia Operator</h1><p>Keep this window on the laptop. Put the main page on the projector.</p></div></div>
<div class="card"><div class="meta"><span class="pill" id="num"></span><span class="pill" id="cat"></span><span class="pill" id="diff"></span><span class="pill ticket" id="ticket"></span></div><div class="q" id="question">Open the projector and start trivia.</div><div class="answer"><b id="answer">—</b><div class="fact" id="fact"></div></div></div>
<div class="card"><div class="grid"><button class="btn" data-a="prev">← Previous</button><button class="btn primary" data-a="reveal">Reveal / Hide</button><button class="btn" data-a="next">Next →</button><button class="btn ice" data-a="timer">Start / Pause Timer</button><button class="btn" data-a="resetTimer">Reset Timer</button><button class="btn" data-a="clean">Projector Mode</button></div><div class="row" style="margin-top:12px"><label class="small">Jump to question:</label><input id="jump" type="number" min="1" max="100"><button class="btn" id="go">Go</button><button class="btn" data-a="home">Title Screen</button></div></div>
<div class="links"><a href="welcome.html" target="_blank">Welcome Screen</a><a href="associate-of-the-month-intro.html" target="_blank">AOTM Intro</a><a href="associate-of-the-month.html" target="_blank">AOTM Reveal</a><a href="./" target="_blank">Open Projector</a><a href="answer-sheet.html" target="_blank">Open / Print Answer Sheet</a><a href="coin-flip.html" target="_blank">Open Coin Flip</a><a href="multiple-choice.html" target="_blank">Archived Multiple Choice</a></div>
</div><script src="questions.js"></script><script>
(()=>{const qs=window.TRIVIA_QUESTIONS||[],KEY='fi_trivia_final_v1',CH='fi-trivia-v3',bc=('BroadcastChannel'in window)?new BroadcastChannel(CH):null,$=id=>document.getElementById(id);
function state(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function render(s=state()){if(!s||s.index<0||!qs[s.index]){$('num').textContent='Title Screen';$('cat').textContent='';$('diff').textContent='';$('ticket').textContent='';$('question').textContent='Open the projector and start trivia.';$('answer').textContent='—';$('fact').textContent='';return}const q=qs[s.index];$('num').textContent='Question '+(s.index+1)+' / '+qs.length;$('cat').textContent=q.category;$('diff').textContent=q.difficulty;$('ticket').textContent=q.tickets+' TICKETS';$('ticket').className='pill ticket t'+q.tickets;$('question').textContent=q.q;$('answer').textContent=q.choices[q.answer];$('fact').textContent=q.fact||'';$('jump').value=s.index+1}
function send(a){bc?.postMessage({type:'action',action:a});setTimeout(()=>render(),120)}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>send(b.dataset.a));$('go').onclick=()=>{const n=parseInt($('jump').value,10);if(n>=1&&n<=qs.length)send('goto:'+(n-1))};bc?.addEventListener('message',e=>{if(e.data?.type==='state')render(e.data.state)});window.addEventListener('storage',e=>{if(e.key===KEY)render()});render()})();
</script></body></html>
